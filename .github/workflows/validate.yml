name: validate

on:
  push:
    branches:
      - main
      - "contest/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit and regression tests
        run: npm test
      - name: Deterministic local demo
        run: npm run demo
      - name: Public-repository preflight
        run: npm run preflight
        env:
          SEMALANE_PROTECTED_TERMS: ${{ secrets.SEMALANE_PROTECTED_TERMS }}
